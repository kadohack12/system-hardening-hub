# Inventaire Ansible — exemple
# Copiez ce fichier en `inventory.ini` et adaptez les hôtes.
#
# Connexion par clé SSH recommandée (évitez les mots de passe en clair).

[linux]
srv-web-01 ansible_host=192.0.2.10
srv-db-01  ansible_host=192.0.2.20

[linux:vars]
ansible_user=admin
ansible_python_interpreter=/usr/bin/python3
